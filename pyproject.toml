[project]
name = "company-rag-voice-agent"
version = "0.1.0"
description = "LiveKit voice agent backed by a LangGraph RAG workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.116,<1",
  "langchain-core>=0.3,<2",
  "langchain-google-genai>=3,<5",
  "langgraph>=0.6,<2",
  "livekit-agents[google,silero]>=1.8,<2",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
